<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style3.css"></link>
    <title>Calculator3</title>

</head>
<body>
    <div class="container">
        <div class="calculator·dark">
        <div class="theme·toggle·active">
            <i class="toggle-icon"></i> 
        </div>
        <div id="display"></div>
        </div>
        <div class="button">
            <table>
                <tr>
                    <td><button class="btn-operator" id="clear">C</button></td>
                    <td><button class="btn-operator" id="/">&divide;</button></td>
                    <td><button class="btn-operator" id="*">&times;</button></td>
                    <td><button class="btn-operator" id="backspace">Del</button></td>
                </tr>
                <tr>
                    <td><button class="btn-number" id="7">C</button></td>
                    <td><button class="btn-number" id="8">&divide;</button></td>
                    <td><button class="btn-number" id="9">&times;</button></td>
                    <td><button class="btn-operator" id="-">-</button></td>
                </tr>
                <tr>
                    <td><button class="btn-number" id="4">C</button></td>
                    <td><button class="btn-number" id="5">&divide;</button></td>
                    <td><button class="btn-number" id="6">&times;</button></td>
                    <td><button class="btn-operator" id="+">+</button></td>
                </tr>
                <tr>
                    <td><button class="btn-number" id="1">C</button></td>
                    <td><button class="btn-number" id="2">&divide;</button></td>
                    <td><button class="btn-number" id="3">&times;</button></td>
                    <td rowspan="2"><button class="btn-equal" id="=">=</button></td>
                </tr>
                <tr>
                    <td><button class="btn-number" id="(">(</button></td>
                    <td><button class="btn-number" id="0">0</button></td>
                    <td><button class="btn-number" id=")">)</button></td>
                 
                </tr>
                
            </table>
        </div>
    <script src="script.js"></script>
</body>
</html>
